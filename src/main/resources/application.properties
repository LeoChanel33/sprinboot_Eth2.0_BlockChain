spring.application.name=eth2.0.application
spring.config.import=optional:file:./.local/database.properties

# Private PoS chain from C:/eth-sepolia-node and C:/eth-sepolia-node2/docker-compose.yml.
# Host-mapped HTTP RPC ports; port 8546 is node-2 HTTP, not WebSocket.
ethereum.default-node=${ETH_DEFAULT_NODE:node-1}
ethereum.connect-timeout=2s
ethereum.request-timeout=5s
ethereum.check-on-startup=${ETH_CHECK_ON_STARTUP:true}
ethereum.fail-fast=${ETH_FAIL_FAST:false}
ethereum.nodes.node-1.rpc-url=${ETH_NODE1_RPC_URL:http://localhost:8545}
ethereum.nodes.node-1.beacon-rest-url=${ETH_NODE1_BEACON_URL:http://localhost:3500}
ethereum.nodes.node-1.chain-id=${ETH_NODE1_CHAIN_ID:32382}
ethereum.nodes.node-1.validator=true
ethereum.nodes.node-2.rpc-url=${ETH_NODE2_RPC_URL:http://localhost:8546}
ethereum.nodes.node-2.beacon-rest-url=${ETH_NODE2_BEACON_URL:http://localhost:3501}
ethereum.nodes.node-2.chain-id=${ETH_NODE2_CHAIN_ID:32382}
ethereum.nodes.node-2.validator=false

# PostgreSQL connection (environment variables can override local defaults).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


# ===============================
# Redis 設定
# ===============================
# 因為 Docker 映射到本機 6379，所以填 localhost
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Bitnami 預設 ALLOW_EMPTY_PASSWORD=yes，所以密碼留空
spring.data.redis.password=
# 選擇資料庫索引 (預設為 0)
spring.data.redis.database=0
# 連線池設定 (選填，增加穩定性)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1ms

# ===============================
# Kafka 設定
# ===============================
# Bootstrap Servers
spring.kafka.bootstrap-servers=localhost:9092
# Producer (傳輸端) 設定
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# 確保訊息有成功寫入 (1 代表 Leader 收到即可)
spring.kafka.producer.acks=1

# Consumer (監聽端) 設定
spring.kafka.consumer.group-id=leo-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# 開啟自動提交 Offset
spring.kafka.consumer.enable-auto-commit=true


# 設定日誌等級
logging.level.root=INFO
# 設定日誌存檔路徑
logging.file.name=logs/eth2.0-app.log
# 設定日誌保存大小與天數
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# 4. 定義日誌輸出的格式（加入時間、執行緒、等級、訊息）
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

